name: Sync voucher error codes

on:
  workflow_dispatch:

permissions: {}

jobs:
  sync-voucher-errors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync from Confluence
        run: python scripts/sync_confluence.py --config config/confluence-voucher-sync.json
        env:
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_PAGE_READ_API_KE }}
          CONFLUENCE_CLOUD_ID: ${{ vars.CONFLUENCE_CLOUD_ID }}
          CONFLUENCE_EMAIL: ${{ vars.CONFLUENCE_EMAIL }}

      - name: Check for documentation changes
        id: changes
        run: |
          if git diff --quiet -- errorCodesVoucher.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Voucher error-code documentation is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes to a branch
        if: steps.changes.outputs.changed == 'true'
        id: commit
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="automation/voucher-error-code-sync-${RUN_ID}"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add errorCodesVoucher.md
          git commit -m "docs: sync voucher error codes from Confluence"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.ref_name }}
          PR_HEAD: ${{ steps.commit.outputs.branch }}
        run: |
          gh pr create \
            --repo "$GH_REPO" \
            --base "$PR_BASE" \
            --head "$PR_HEAD" \
            --title "docs: sync voucher error codes" \
            --body "Updates the Voucher error-code sections and any available Design test cases from Confluence. Generated by the manual sync workflow."
